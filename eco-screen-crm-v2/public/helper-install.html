<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安装找客户助手</title><body style="font:18px/1.8 system-ui;max-width:650px;margin:40px auto;padding:20px"><h1>首次安装，之后只需贴链接</h1><ol><li><a href="eco-screen-helper.zip" download>下载助手</a>，解压到一个固定文件夹。</li><li>用电脑 Chrome 打开 <code>chrome://extensions</code>，开启「开发者模式」。</li><li>点击「加载已解压的扩展程序」，选择刚才的文件夹。</li><li>刷新 Eco Screen，贴同行链接，点击「开始找客户」。</li></ol><p>助手只在点击扫描时读取打开页面的公开评论。不会读取密码、私信或发送消息。遇到登录或安全验证请自行完成。平台不提供评论时会说明失败，不保证能读取每个贴文。</p><p>目前需电脑 Chrome／Edge；手机和未安装助手的浏览器无法使用此采集方式。自动评分为现有关键词规则评分。</p><a href="https://eco-screen-crm-v2.vercel.app/">返回系统</a></body></html>
